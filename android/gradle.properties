org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental compiler persists file paths as relative paths, which
# throws (IllegalArgumentException: different roots) whenever the project
# and the Flutter pub cache live on different Windows drive letters (M: vs
# C: here) — hit as soon as any plugin with real Kotlin sources is added
# (shared_preferences_android is the first one in this project). Disabling
# incremental compilation avoids that codepath entirely; full recompiles
# are slower but this only affects build time, not the app itself.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
